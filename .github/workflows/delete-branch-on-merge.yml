name: Delete branch on PR merge

on:
  pull_request:
    types:
      - closed

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete head branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.ref;
            // Never delete the default branch (main/master)
            const defaultBranch = context.payload.repository.default_branch;
            if (ref === defaultBranch) {
              core.info(`Skipping deletion of default branch: ${ref}`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${ref}`,
              });
              core.info(`Deleted branch: ${ref}`);
            } catch (err) {
              core.warning(`Failed to delete branch ${ref}: ${err.message}`);
            }
