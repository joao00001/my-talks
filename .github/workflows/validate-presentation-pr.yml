name: Validate presentation PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate labels and presentation files
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const commentMarker = '<!-- validate-presentation-pr -->';

            const presentationExtensions = new Set([
              '.pdf',
              '.ppt',
              '.pptx',
              '.odp',
              '.key',
              '.png',
              '.jpg',
              '.jpeg',
              '.gif',
              '.svg',
              '.webp',
            ]);

            const labels = context.payload.pull_request.labels.map(({ name }) => name);
            const hasCodeWriteLabel = labels.includes('code-write');
            const hasPresentationLabel = labels.includes('presentation');
            const labelsSummary = labels.length > 0 ? labels.map((label) => `\`${label}\``).join(', ') : 'none';
            const issueNumber = context.payload.pull_request.number;

            const findExistingComment = async () => {
              for await (const response of github.paginate.iterator(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              })) {
                const existingComment = response.data.find(({ body: commentBody, user }) => {
                  return commentBody?.includes(commentMarker) && user?.login === 'github-actions[bot]';
                });

                if (existingComment) {
                  return existingComment;
                }
              }

              return null;
            };

            const upsertComment = async (body) => {
              const existingComment = await findExistingComment();

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body,
                });
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            };

            if (hasCodeWriteLabel) {
              const successMessage = [
                commentMarker,
                '✅ Esta PR está seguindo todas as regras de contribuição.',
                '',
                '- A label `code-write` está presente e tem prioridade quando múltiplas labels são usadas.',
                `- Labels atuais: ${labelsSummary}.`,
              ].join('\n');

              await upsertComment(successMessage);
              core.info('A label `code-write` está presente; a validação de apresentação foi ignorada.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
              per_page: 100,
            });

            const changedPresentationFiles = files
              .filter(({ status }) => ['added', 'modified', 'renamed', 'copied', 'changed'].includes(status))
              .map(({ filename }) => filename)
              .filter((filename) => presentationExtensions.has(path.extname(filename).toLowerCase()));

            if (hasPresentationLabel && changedPresentationFiles.length > 0) {
              const successMessage = [
                commentMarker,
                '✅ Esta PR está seguindo todas as regras de contribuição.',
                '',
                `- Labels atuais: ${labelsSummary}.`,
                `- Arquivos de apresentação detectados: ${changedPresentationFiles.map((filename) => `\`${filename}\``).join(', ')}.`,
              ].join('\n');

              await upsertComment(successMessage);
              core.info(`A validação de apresentação foi aprovada para: ${changedPresentationFiles.join(', ')}`);
              return;
            }

            const errors = [];

            if (!hasPresentationLabel && changedPresentationFiles.length === 0) {
              errors.push('Nenhum arquivo de apresentação foi encontrado e a PR não tem a label `presentation`. Se esta PR é de manutenção do repositório, documentação ou código, adicione a label `code-write`.');
            } else if (!hasPresentationLabel) {
              errors.push('Adicione a label `presentation` nesta PR.');
            } else if (changedPresentationFiles.length === 0) {
              errors.push('Inclua ou modifique pelo menos um arquivo de apresentação, como `.pdf`, `.pptx`, `.odp` ou `.png`.');
            }

            if (errors.length === 0) {
              core.info('Nenhuma falha de validação foi encontrada.');
              return;
            }

            const failureMessage = [
              commentMarker,
              '⚠️ Esta PR não está seguindo as regras de contribuição.',
              '',
              `- Labels atuais: ${labelsSummary}.`,
              `- Arquivos de apresentação detectados: ${changedPresentationFiles.length > 0 ? changedPresentationFiles.map((filename) => `\`${filename}\``).join(', ') : 'nenhum'}.`,
              '',
              ...errors.map((error) => `- ${error}`),
            ].join('\n');

            await upsertComment(failureMessage);
            core.setFailed(errors.join('\n'));
